name: 检查 · 插件发布包

# npm 发布流程自动调用；手动入口用于检查已有版本，不操作市场上架。
on:
  workflow_call:
    inputs:
      package:
        description: '刚发布的完整包名与精确版本'
        required: true
        type: string
      checker_ref:
        description: '检查器固定提交，须与调用 uses 的 SHA 一致'
        required: true
        type: string
      runtime:
        description: '留空时读取当前产品固定的 DSH 运行时，并记录产品提交'
        required: false
        default: ''
        type: string
    secrets:
      PLUGIN_CHECK_REGISTRY_TOKEN:
        description: '私有 Registry 只读服务账号令牌'
        required: true
  workflow_dispatch:
    inputs:
      package:
        description: '指定完整包版本，例如 @tokensapi/example@1.2.3'
        required: true
        type: string
      runtime:
        description: '目标 DSH 运行时版本；填写待验证产品实际使用的版本'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-package-check-${{ github.repository }}-${{ inputs.package }}-${{ inputs.runtime }}
  cancel-in-progress: false

jobs:
  check:
    name: 检查 · 指定插件发布包
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: https://npm.tokensapi.ai/
      PLUGIN_PACKAGE: ${{ inputs.package }}
      TARGET_RUNTIME: ${{ inputs.runtime }}
    steps:
      - name: 准备 · 固定检查器源码
        id: source
        env:
          CHECKER_REF: ${{ inputs.checker_ref || github.sha }}
        run: |
          [[ "$CHECKER_REF" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::检查器必须固定到完整提交 SHA'; exit 1; }
          echo "commit=$CHECKER_REF" >> "$GITHUB_OUTPUT"
      - name: 准备 · 获取源码
        uses: actions/checkout@v7
        with:
          repository: TokensAPI/tokens_DshPluginCheck_code
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - name: 准备 · 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: 准备 · 安装检查器固定依赖
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: 准备 · 解析目标产品运行时
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_RUNTIME" ]]; then
            product_commit="$(gh api repos/TokensAPI/TokensCowork/commits/master --jq .sha)"
            [[ "$product_commit" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/TokensAPI/TokensCowork/contents/product.json?ref=$product_commit" --jq .content \
              | base64 --decode > "$RUNNER_TEMP/plugin-check-product.json"
            TARGET_RUNTIME="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/plugin-check-product.json", "utf8")).desktop.runtimeVersion')"
            echo "TARGET_RUNTIME=$TARGET_RUNTIME" >> "$GITHUB_ENV"
            printf '产品基线：`TokensAPI/TokensCowork@%s`\n\n' "$product_commit" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 准备 · 校验参数与只读 Registry 权限
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/plugin-check.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG" >> "$GITHUB_ENV"
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::error::缺少 PLUGIN_CHECK_REGISTRY_TOKEN（私有 Registry 只读令牌）；未执行插件包检查。'
            exit 1
          fi
          node --input-type=module <<'NODE'
          if (!/^(?:@[a-z0-9._-]+\/)?[a-z0-9._-]+@\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$/i.test(process.env.PLUGIN_PACKAGE)) throw new Error('须指定包名与精确版本，不接受 latest、URL 或命令')
          if (!/^\d+\.\d+\.\d+(?:-[a-z0-9.-]+)?$/i.test(process.env.TARGET_RUNTIME)) throw new Error('须指定目标产品实际使用的运行时版本')
          NODE
          printf '//npm.tokensapi.ai/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          chmod 600 "$NPM_CONFIG_USERCONFIG"
          [[ "$(npm whoami --registry=https://npm.tokensapi.ai/)" == market ]] || {
            echo '::error::包检查必须使用 market 只读账号，不接受发布账号凭证。'
            exit 1
          }
      - name: 检查 · 使用本次源码的检查器
        id: check
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLUGIN_CHECK_REGISTRY_TOKEN }}
        run: |
          status=0
          node bin/dsh-plugin-check.mjs --package "$PLUGIN_PACKAGE" --runtime "$TARGET_RUNTIME" \
            --json > report.json || status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
      - name: 报告 · 展示实际检查结果
        env:
          CHECKER_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'
          let report
          try { report = JSON.parse(readFileSync('report.json', 'utf8')) }
          catch { throw new Error('检查工具未产生有效 JSON；不能宣称检查通过') }
          if (`${report.plugin}@${report.version}` !== process.env.PLUGIN_PACKAGE || report.runtime !== process.env.TARGET_RUNTIME)
            throw new Error('报告的包版本或目标运行时与本次检查不一致')
          console.log(`# ${report.ok ? '✅ 合格' : '❌ 不合格'} · ${process.env.PLUGIN_PACKAGE}`)
          console.log(`目标运行时：${process.env.TARGET_RUNTIME}\n`)
          const tool = JSON.parse(readFileSync('package.json', 'utf8'))
          console.log(`检查器：${tool.name}@${tool.version}，源码提交：${process.env.CHECKER_COMMIT}\n`)
          console.log('| 结果 | 规则 | 说明 |\n| --- | --- | --- |')
          for (const [mark, findings] of [['❌', report.errors], ['⚠️', report.warnings]]) {
            for (const item of findings ?? []) console.log(`| ${mark} | ${item.rule} | ${String(item.message).replaceAll('|', '\\|').replaceAll('\n', ' ')} |`)
          }
          for (const phase of report.phases ?? []) {
            if (phase.skipped) console.log(`\n${phase.phase} 未执行：${phase.skipped}`)
          }
          console.log('\n这是发布包检查记录，不替代内置插件功能回归，也不会自动操作市场上架。')
          if (report.ok !== true) process.exitCode = 1
          NODE
      - name: 报告 · 保存原始 JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-check-${{ github.run_id }}
          path: report.json
          if-no-files-found: ignore
      - name: 检查 · 保留工具退出状态
        if: always() && steps.check.outcome == 'success'
        env:
          CHECK_STATUS: ${{ steps.check.outputs.status }}
        run: exit "$CHECK_STATUS"
      - name: 清理 · 删除临时 npm 配置
        if: always()
        run: rm -f -- "$RUNNER_TEMP/plugin-check.npmrc"
