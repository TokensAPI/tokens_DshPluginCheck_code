# Runs the test suite on every Node version the package claims to support.
#
# Branches and pull requests only. Tag pushes are handled by publish-npm.yml,
# which runs these same checks itself before it publishes anything.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Covers the engines range in package.json (>=22.0.0).
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      # CI has no staged DSH host, so the real-host contract cases (HOST-01…15)
      # cannot run here. This step prints their NOT EXECUTED list and exits
      # non-zero on purpose — `continue-on-error` keeps CI green while making it
      # impossible to read a green run as "the host contracts passed". The gate
      # that really runs them is TokensCowork's product check, which sets
      # DSH_HOST_ROOT to a staged host (agent-hub T0047).
      - name: Real-host contracts (not executed without a host)
        continue-on-error: true
        run: npm run check:host
